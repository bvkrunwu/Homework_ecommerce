{% extends 'catalog_base.html' %}

{% block title %}
{% if object %}
Редактирование продукта
{% else %}
Создание продукта
{% endif %}
{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="form">
                    <div class="form-body">
                        {% csrf_token %}
                        {{ form.non_field_errors }}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary">
                        {% if object %}
                        Сохранить
                        {% else %}
                        Создать
                        {% endif %}
                    </button>
                    <a href="{% url 'catalog:product_list' %}" class="btn btn-primary">Назад</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
