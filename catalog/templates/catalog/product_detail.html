{% extends 'base.html' %}

{% block title %}Детализация продукта{% endblock %}

{% block content %}
<main>
    <div class="col">
        <div class="card h-100">
            <img src="{{ product.images.url }}" class="card-img-top" alt="{{ product.name }}">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title mb-2">{{ product.name }}</h5>
                <p class="card-text flex-grow-1">{{ product.description }}</p>
                <div class="mt-auto"> <!-- Контент прижимается вниз -->
                    <a href="{% url 'catalog:product_list' %}" class="btn btn-primary">Назад</a>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
